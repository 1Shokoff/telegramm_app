# Витрина iApki: уточнения к товарам.
#
# Товар появляется сам — по одному на каждый файл <слаг>-<версия>.ipa в этой
# папке. Название, версия, иконка и минимальная iOS берутся из сборки. Здесь
# можно поправить любое поле; чего нет в файле — берётся из сборки.
#
#   [слаг]          — для приложения, на любую его версию:  [sber]
#   ["файл.ipa"]    — только для одного файла:              ["sber-17.6.1.ipa"]
#
# Поля:
#   name      название в витрине
#   category  категория — фильтр над каталогом; без неё товар попадёт в «Другое»
#   desc      описание; его читает покупатель и модерация платёжной системы
#   icon      своя картинка вместо иконки из сборки — файл рядом: "sber.png"
#   color     цвет плитки: "#21A038"
#   dark      true — тёмная буква на светлой плитке, когда иконки нет
#   version   версия вместо той, что в имени файла
#   min_ios   минимальная iOS вместо той, что в сборке
#   order     место в каталоге: меньше — выше
#   hidden    true — не показывать товар; файл остаётся на сервере
#   price     цена при заказе этого приложения отдельно (витрина продаёт весь каталог)
#
# Бот перечитывает файл сам — перезапускать ничего не нужно.


# Порядок фильтров над каталогом. Категории, которых здесь нет, идут следом.
categories = ["Банки", "Общение", "Медиа", "Нейросети", "Сервисы"]

# Плитки в шапке витрины, по порядку.
featured = ["sber", "tbank", "max", "yandex", "spotify", "vk-video"]

