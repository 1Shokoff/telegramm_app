<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0d09">
  <title>iApki</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/icon.svg">
  <link rel="apple-touch-icon" href="/static/brand.png">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <img src="/static/brand/icon.svg" alt="iApki" width="44" height="44">
        </div>
        <div class="brand-text">
          <div class="brand-title">iApki</div>
          <div class="brand-sub" id="brandSub">Доступ для вашего iPhone</div>
        </div>
      </div>
      <button class="icon-btn" data-action="chat" title="Переписка по заказу" aria-label="Переписка">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.6A8.4 8.4 0 0 1 3.6 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8.4 8.4z"/>
        </svg>
      </button>
    </header>

    <main id="view" class="view">
      <div class="loader">
        <img src="/static/brand/icon.svg" alt="" width="64" height="64">
        <span>Загружаем…</span>
      </div>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
